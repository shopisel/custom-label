name: Custom Label Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout custom-label
        uses: actions/checkout@v4
        with:
          path: custom

      - name: Clone white-label base
        uses: actions/checkout@v4
        with:
          repository: shopisel/frontend-web
          ref: develop
          path: app

      - name: Apply custom brand
        run: cp custom/brand.config.ts app/src/brand.config.ts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-label-dist
          path: app/dist/
